# Include in each Kubah Nabawi server block. Serve only the verified frontend.
root /srv/kubah-nabawi/current/webroot;
autoindex off;
server_tokens off;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
# Existing admin embeds require same-origin frames. Do not use DENY.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
add_header Cache-Control "no-cache" always;

location = / { return 302 /katalog$is_args$args; }
location = /admin { try_files /index.html =404; }
location = /katalog { try_files /toko.html =404; }
location = /admin/ { return 302 /admin$is_args$args; }
location = /katalog/ { return 302 /katalog$is_args$args; }
location = /index.html { return 302 /admin$is_args$args; }
location = /toko.html { return 302 /katalog$is_args$args; }
location = /supplier { return 302 "/katalog$is_args$args#kerjasama"; }
location = /reseller { return 302 "/katalog$is_args$args#reseller"; }
location = /kurir { try_files /kurir.html =404; }
location = /kurir/ { return 302 /kurir$is_args$args; }
# Existing *.html/hash links (admin submodules, reseller documents, public info)
# remain available. Missing assets must return 404, never the admin shell.
location / { try_files $uri =404; }
location ~ /\. { deny all; }
location ~* \.(env|sql|bak|gz|zip|log|pem|key)$ { deny all; }
